name: build

# Branches in this repository are tested on push (a pull request shows those
# runs too); superseded runs of the same branch are cancelled. Pushing a tag
# vX.Y.Z, or running the workflow by hand with a release tag, also publishes
# release X.Y.Z with the disk image once every test has passed.
on:
  push:
  workflow_dispatch:
    inputs:
      release:
        description: Publish this commit as a release, e.g. v0.0.1 (empty to only test)
        required: false
        default: ""

concurrency:
  # A release run (workflow_dispatch) leaves the push run of its commit be.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests (Linux, sanitizers, fuzz)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/build.yml
      - run: pip install numpy astropy lz4 zstandard
      - run: sudo apt-get update && sudo apt-get install -y libexpat1-dev
      - name: Decode and binning vs astropy
        run: make test
      - name: AddressSanitizer + UBSan, damaged files
        run: |
          gcc -std=c99 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=undefined \
              -Icore -Ithird_party/zstd -o build/fqtool-asan tools/fqtool.c core/*.c \
              third_party/zstd/zstddeclib.c -lz -lexpat -lm -lpthread
          python3 tests/test_core.py build/fqtool-asan build/testdata > /dev/null
          python3 tests/test_xisf.py build/fqtool-asan build/testdata
          python3 tests/fuzz.py build/fqtool-asan build/testdata 500

  macos:
    name: macOS app + Quick Look (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Version
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          # A release sets the version; otherwise the Makefile's is used.
          tag=$RELEASE
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag=$GITHUB_REF_NAME; fi
          if [ -n "$tag" ]; then
            echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "not a release tag: $tag"; exit 1; }
            echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
          fi
      - name: Build
        run: |
          # Whatever clang and codesign come first on PATH (Homebrew, conda,
          # Nix, ...) must not be used: put broken ones there.
          mkdir -p /tmp/badbin
          for tool in clang codesign; do
            printf '#!/bin/sh\necho "the %s on PATH was used" >&2\nexit 1\n' $tool > /tmp/badbin/$tool
            chmod +x /tmp/badbin/$tool
          done
          PATH=/tmp/badbin:$PATH make app
      - name: Bundle contents
        run: |
          cmp LICENSE build/uFits.app/Contents/Resources/LICENSE
          cmp third_party/zstd/LICENSE build/uFits.app/Contents/Resources/zstd-LICENSE
          find build/uFits.app -type f | sort
          lipo -info build/uFits.app/Contents/MacOS/uFits build/uFits.app/Contents/PlugIns/*.appex/Contents/MacOS/*
          codesign -d --entitlements - build/uFits.app/Contents/PlugIns/uFitsPreview.appex
          du -sh build/uFits.app
      - name: Disk image
        run: |
          make dmg
          dmg=$(ls build/uFits-*.dmg)
          hdiutil verify "$dmg"
          mkdir -p /tmp/dmg
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/dmg "$dmg"
          ls -la /tmp/dmg
          test "$(readlink /tmp/dmg/Applications)" = /Applications
          codesign --verify --deep --strict /tmp/dmg/uFits.app
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' /tmp/dmg/uFits.app/Contents/Info.plist)
          echo "version $version"
          test "$dmg" = "build/uFits-$version.dmg"
          diff -r build/uFits.app /tmp/dmg/uFits.app   # the app tested below
          hdiutil detach /tmp/dmg
          ls -l "$dmg"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/build.yml
      - run: pip install numpy astropy lz4 zstandard
      - name: Core tests (Apple clang, GCD)
        run: make test
      - name: Install and register the extensions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          make install
          # The one-command installer over that: the latest release, downloaded,
          # then the disk image built above, which the tests below use.
          sh install.sh
          UFITS_DMG=$(ls build/uFits-*.dmg) sh install.sh
          # The app looks for a newer release, as it does once a day.
          /Applications/uFits.app/Contents/MacOS/uFits --check-for-updates
          # When the app runs the installer to update itself, it keeps running
          # (and opens the new copy once the installer is done).
          open -a /Applications/uFits.app
          sleep 3
          UFITS_FROM_APP=1 UFITS_DMG=$(ls build/uFits-*.dmg) sh install.sh
          pgrep -x uFits
          osascript -e 'quit app "uFits"' || pkill -x uFits || true
          # What macOS takes each extension uFits claims for.
          /Applications/uFits.app/Contents/MacOS/uFits --file-types
          # A launchd job (set up by the installer) looks for updates now and then.
          plutil -p ~/Library/LaunchAgents/io.github.lmytime.uFits.update.plist
          launchctl print "gui/$(id -u)/io.github.lmytime.uFits.update" | grep -E "^\s*(state|program|path) =" || true
          # Both extensions are registered (the tests below need them).
          pluginkit -m -v -i io.github.lmytime.uFits.Preview | grep io.github.lmytime.uFits.Preview
          pluginkit -m -v -i io.github.lmytime.uFits.Thumbnail | grep io.github.lmytime.uFits.Thumbnail
          # Every copy that pluginkit knows of (the installer unregisters others).
          pluginkit -m -A -D -v -i io.github.lmytime.uFits.Thumbnail || true
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -dump \
            | grep -B2 -A8 "gov.nasa.gsfc.fits" | head -40 || true
      - name: Icon size beside other apps' (best effort)
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: |
          # The share of its square each icon fills, as Finder and the Dock
          # draw it: uFits' should be as big as other apps'.
          make build/iconsize
          xcode=$(ls -d /Applications/Xcode*.app 2>/dev/null | tail -1)
          build/iconsize build/ql/app-icons.png /Applications/uFits.app /System/Applications/Calculator.app \
            /System/Applications/TextEdit.app /System/Applications/Preview.app /Applications/Safari.app \
            "/System/Applications/System Settings.app" "/Applications/Google Chrome.app" /Applications/Firefox.app \
            ${xcode:+"$xcode"} || true
      - name: App icon in light and dark mode, and the icon of choice (best effort)
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          app=/Applications/uFits.app
          mkdir -p build/ql
          xcode=$(ls -d /Applications/Xcode_26*.app | sort | tail -1)
          DEVELOPER_DIR=$xcode/Contents/Developer xcrun actool --help 2>&1 | grep -i -E "icon|appear|stack|fallback" || true
          # What actool made of AppIcon.icon.
          cat > /tmp/renditions.py <<'PY'
          import collections, json, sys
          seen = collections.Counter()
          for r in json.load(sys.stdin):
              key = (r.get("AssetType"), r.get("Name"), r.get("Appearance", "-"), r.get("Idiom", ""))
              seen[key] += 1
          for key, n in sorted(seen.items(), key=str):
              print("  ", n, "x", key)
          PY
          ls -la $app/Contents/Resources
          plutil -p build/icon/partial.plist || true
          xcrun assetutil --info $app/Contents/Resources/Assets.car | python3 /tmp/renditions.py || true
          # Which icon is drawn: with macOS in light mode, then in dark mode.
          for mode in false true false; do
            osascript -e "tell application \"System Events\" to tell appearance preferences to set dark mode to $mode" || true
            sleep 4
            echo "dark mode: $mode"
            build/iconsize /tmp/icon-$mode.png $app || true
            build/iconsize /tmp/icon-$mode.png --appearance aqua $app --appearance dark $app || true
            killall Dock 2>/dev/null || true
            sleep 4
            screencapture -x build/ql/app-dock-dark-$mode.png || true
          done
          # The icon of choice: a custom icon on the app. It still opens, and
          # Quick Look still uses its extensions.
          $app/Contents/MacOS/uFits --set-icon light && echo "set: light" || echo "could not set the icon"
          build/iconsize build/ql/app-icon-chosen.png $app || true
          open $app
          sleep 4
          pgrep -x uFits > /dev/null && echo "uFits opens with an icon chosen" || echo "uFits did not open"
          screencapture -x build/ql/app-dock-chosen.png || true
          pkill -x uFits || true
          $app/Contents/MacOS/uFits --set-icon auto && echo "set: auto" || echo "could not unset the icon"
          build/iconsize /tmp/icon-auto.png $app || true
      - name: Quick Look thumbnails (QLThumbnailGenerator)
        timeout-minutes: 4
        run: |
          make qltools
          cd build/testdata
          # The FITS files of X-ray missions, by their own extensions.
          cp pha.fits spectrum.pha; cp pha.fits spectrum.pi; cp pha.fits response.rmf
          cp lc_tess.fits curve.lc; cp catalog_gaia.fits events.evt; cp f32.fits image.img
          ../qlthumb ../ql spectrum.pha spectrum.pi response.rmf curve.lc events.evt
          # .img is a disk image to macOS too: not checked.
          ../qlthumb ../ql image.img || true
          ../qlthumb ../ql f32.fits u16.fits rgb.fits bayer_rggb.fits rice_f32_sd1.fits \
            footprint_f32.fits mef.fits spec1d.fits cube5.fits lc_tess.fits lc_mag.fits spec_sdss.fits pha.fits \
            catalog_wrap.fits catalog_gaia.fits xisf_mono.xisf xisf_rgb.xisf xisf_zstd.xisf \
            xisf_utf8_declaration.xisf xisf_uppercase_hex_zstd.xisf
          # Which way up: a bright block on the first pixels belongs in the
          # lower left of a FITS image, the upper left of an XISF one.
          python3 ../../tests/macos/make_orient_files.py .
          # Icons too small for a thumbnail (list and column views) keep the
          # file's icon, and bigger ones still get one (a file not seen yet).
          cp orient-ll.fits small-icon.fits
          ../qlthumb --size 32 --none ../ql small-icon.fits
          ../qlthumb ../ql small-icon.fits
          ../qlthumb ../ql orient-ll.fits orient-ll-big.fits orient-ll-rice.fits orient-ul-topdown.fits orient-ul.xisf
          # The same as Finder asks for its icons (Quick Look may frame them).
          ../qlthumb --icon ../ql orient-ll.fits orient-ll-big.fits orient-ul-topdown.fits orient-ul.xisf
      - name: Finder icons (best effort)
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: |
          # The orientation files in a Finder window, for review: blocks in
          # the lower left (orient-ll-*) and upper left (orient-ul-*).
          mkdir -p /tmp/orient
          cp build/testdata/orient-* /tmp/orient/
          osascript -e 'tell application "Finder"' -e 'activate' \
            -e 'set w to make new Finder window to (POSIX file "/tmp/orient" as alias)' \
            -e 'set current view of w to icon view' -e 'set bounds of w to {40, 60, 1240, 900}' \
            -e 'end tell' || true
          sleep 15
          screencapture -x build/ql/app-finder.png || true
          osascript -e 'tell application "Finder" to close every window' || true
      - name: Quick Look preview (QLPreviewView)
        if: ${{ !cancelled() }}
        timeout-minutes: 4
        run: |
          cd build/testdata
          # image.img is FITS; disk.img a disk image (Quick Look shows it as usual).
          cp ../uFits-*.dmg disk.img
          ../qlpreview ../ql f32.fits spec1d.fits mef.fits lc_tess.fits catalog_gaia.fits tables_mixed.fits \
            spectrum.pha events.evt image.img disk.img xisf_mono.xisf xisf_multi.xisf xisf_zstd.xisf \
            xisf_utf8_declaration.xisf xisf_uppercase_hex_zstd.xisf
      - name: Preview UI (HDU menu, plane slider, plots, tables, find bar, timings)
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        run: |
          python3 tests/macos/make_big_files.py build/testdata
          build/uitest build/ql build/testdata
      - name: Quick Look clicks (HDU menu and mode switch answer at once)
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: build/clicklag build/ql build/testdata/mef.fits
      - name: Update notice in Quick Look
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: |
          # As if the app had seen uFits 99.0.0 out (a preview may not go online:
          # the app looks): the preview, which reads the app's settings, says
          # "Update available", and a click on it opens the app to update.
          defaults write io.github.lmytime.uFits FQUpdateLatest -string 99.0.0
          status=0
          build/clicklag build/ql build/testdata/mef.fits --update || status=$?
          defaults delete io.github.lmytime.uFits FQUpdateLatest
          exit $status
      - name: Stretch chosen in Quick Look
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: |
          # The stretch menu of a preview in Quick Look sets the app's setting:
          # one setting for Quick Look and the app (Preview.entitlements).
          defaults delete io.github.lmytime.uFits stretch 2>/dev/null || true
          status=0
          build/clicklag build/ql build/testdata/mef.fits --stretch || status=$?
          defaults read io.github.lmytime.uFits stretch || true
          defaults delete io.github.lmytime.uFits stretch 2>/dev/null || true
          exit $status
      - name: App windows (best effort)
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: |
          open /Applications/uFits.app
          sleep 4
          screencapture -x build/ql/app-setup.png || true
          # uFits › About uFits (when System Events may click it).
          osascript -e 'tell application "System Events" to tell process "uFits" to click menu item 1 of menu 1 of menu bar item 2 of menu bar 1' || true
          sleep 2
          screencapture -x build/ql/app-about.png || true
          open -a /Applications/uFits.app build/testdata/rgb.fits
          sleep 4
          screencapture -x build/ql/app-viewer.png || true
          osascript -e 'quit app "uFits"' || true
      - name: Another copy of uFits, numbered higher (as the first builds were)
        if: ${{ !cancelled() }}
        timeout-minutes: 4
        run: |
          # A copy of uFits 1.0.0 left somewhere: which copy makes Finder's
          # thumbnails? The app says what it sees; the installer unregisters
          # the other copy and says where it is.
          lsregister=/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
          old=/private/tmp/old-builds/uFits.app
          mkdir -p /private/tmp/old-builds /tmp/copycheck
          ditto /Applications/uFits.app "$old"
          for p in "$old/Contents" "$old"/Contents/PlugIns/*.appex/Contents; do
            plutil -replace CFBundleShortVersionString -string 1.0.0 "$p/Info.plist"
            plutil -replace CFBundleVersion -string 1 "$p/Info.plist"
          done
          for x in "$old"/Contents/PlugIns/*.appex "$old"; do
            codesign --force --sign - --preserve-metadata=entitlements,flags "$x"
          done
          "$lsregister" -f "$old"
          pluginkit -a "$old"/Contents/PlugIns/*.appex
          sleep 2
          pluginkit -m -A -D -v -i io.github.lmytime.uFits.Thumbnail
          # The copy whose thumbnail extension runs for a file not seen before
          # (on macOS 15 it has been the old one, though pluginkit named the other).
          which_copy() {
            pkill -x uFitsThumbnail || true
            qlmanage -r >/dev/null 2>&1 || true
            qlmanage -r cache >/dev/null 2>&1 || true
            sleep 1
            cp build/testdata/orient-ll.fits "/tmp/copycheck/$1.fits"
            build/qlthumb /tmp/copycheck "/tmp/copycheck/$1.fits" || true
            ran=$(ps -axo command | grep '[u]FitsThumbnail' || echo none)
            echo "pluginkit: $(pluginkit -m -v -i io.github.lmytime.uFits.Thumbnail)"
            echo "the thumbnail came from: $ran"
          }
          which_copy before
          open /Applications/uFits.app
          sleep 5
          screencapture -x build/ql/app-copies.png || true
          pkill -x uFits || true
          UFITS_DMG=$(ls build/uFits-*.dmg) sh install.sh | tee /tmp/copycheck/install.log
          grep -F old-builds/uFits.app /tmp/copycheck/install.log
          for id in Preview Thumbnail; do
            pluginkit -m -v -i io.github.lmytime.uFits.$id | grep -F /Applications/uFits.app/
          done
          which_copy after
          case $ran in
          /Applications/uFits.app/*) ;;
          *) echo "FAIL the thumbnail did not come from /Applications/uFits.app"; exit 1 ;;
          esac
          rm -rf /private/tmp/old-builds
      - name: Update, as a user would
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        run: |
          # This build, numbered 0.0.1, updates itself to the latest release
          # through its own offer and its Update button: the release's
          # installer replaces it, the new copy opens and this one quits.
          latest=$(curl -fsLI -o /dev/null -w '%{url_effective}' https://github.com/lmytime/uFits/releases/latest)
          latest=${latest##*/v}
          app=/Applications/uFits.app
          UFITS_DMG=$(ls build/uFits-*.dmg) sh install.sh > /dev/null
          for p in "$app/Contents" "$app"/Contents/PlugIns/*.appex/Contents; do
            plutil -replace CFBundleShortVersionString -string 0.0.1 "$p/Info.plist"
          done
          for x in "$app"/Contents/PlugIns/*.appex "$app"; do
            codesign --force --sign - --preserve-metadata=entitlements,flags "$x"
          done
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "$app"
          # As at first: nothing seen out there yet.
          for key in FQUpdateLatest FQUpdateChecked FQUpdateTried FQSkippedVersion; do
            defaults delete io.github.lmytime.uFits $key 2>/dev/null || true
          done
          status=0
          sh tests/macos/update_check.sh "$latest" build/ql || status=$?
          # This build again, for what follows.
          UFITS_DMG=$(ls build/uFits-*.dmg) sh install.sh > /dev/null
          exit $status
      - name: Crash reports
        if: ${{ !cancelled() }}
        run: |
          ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i ufits || echo "no uFits crash reports"
          for f in ~/Library/Logs/DiagnosticReports/*uFits*; do [ -f "$f" ] && head -150 "$f"; done; true
      - name: Quick Look logs
        if: ${{ !cancelled() }}
        run: |
          # Looks for a newer release (the app, the launchd job), the preview's
          # "Update available", and what the sandbox kept the preview from
          log show --last 15m --style compact --predicate 'eventMessage CONTAINS "the latest release is" OR
            eventMessage CONTAINS "Update available" OR eventMessage CONTAINS "how to update" OR
            (eventMessage CONTAINS "uFitsPreview" AND eventMessage CONTAINS "deny")' | tail -25 || true
          log show --last 5m --style compact \
            --predicate 'process BEGINSWITH "uFits" OR (subsystem CONTAINS "quicklook" AND messageType >= 16)' \
            | tail -60 || true
      - name: Uninstall, and nothing is left
        if: ${{ !cancelled() }}
        run: sh tests/macos/uninstall_check.sh
      - name: Images for review (base64)
        if: ${{ !cancelled() }}
        run: tests/macos/print_images.sh build/ql
      - name: Package
        if: ${{ !cancelled() }}
        run: make zip
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && matrix.os == 'macos-15' }}
        with:
          name: uFits
          path: |
            build/uFits.zip
            build/ql/*.png
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'macos-15'
        with:
          name: uFits-dmg
          path: build/uFits-*.dmg
          if-no-files-found: error

  release:
    name: Release
    if: (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')) || inputs.release != ''
    needs: [core, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: uFits-dmg
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release }}
        run: |
          cd dist
          dmg=$(ls uFits-*.dmg)
          test "$dmg" = "uFits-${TAG#v}.dmg"
          sha256sum "$dmg" | tee "$dmg.sha256"
          # The installer installs the release it comes with.
          sed "/^VERSION=/s/@VERSION@/${TAG#v}/" ../install.sh > install.sh
          grep "^VERSION=" install.sh | grep -qF "${TAG#v}"
          sed "s/@TAG@/$TAG/g" ../.github/release-notes.md > notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Published already: its disk image stays as it is; the installer
            # and the notes are brought up to date.
            gh release upload "$TAG" install.sh --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          else
            # Tags this commit, unless the tag was pushed.
            gh release create "$TAG" "$dmg" "$dmg.sha256" install.sh --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "uFits ${TAG#v}" --notes-file notes.md
          fi

  update-from-previous:
    name: Update from the previous release
    if: (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')) || inputs.release != ''
    needs: release
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: The previous release updates itself to this one, as a user would
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release }}
        run: |
          prev=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=10" --jq '.[].tag_name' | grep -vxF "$TAG" | head -1)
          # What uFits asks, .../releases/latest, leads to the new release only
          # a minute or two after it is published.
          for i in $(seq 1 40); do
            latest=$(curl -fsLI -o /dev/null -w '%{url_effective}' "https://github.com/$GITHUB_REPOSITORY/releases/latest" || true)
            [ "${latest##*/}" = "$TAG" ] && break
            sleep 15
          done
          echo "latest release: ${latest##*/}"
          echo "uFits ${prev#v}, as released, updating itself to ${TAG#v}"
          UFITS_VERSION=${prev#v} sh install.sh
          mkdir -p pics
          sh tests/macos/update_check.sh "${TAG#v}" pics
      - name: Uninstall, and nothing is left
        if: ${{ !cancelled() }}
        run: sh tests/macos/uninstall_check.sh
      - name: Pictures for review (base64)
        if: ${{ !cancelled() }}
        run: tests/macos/print_images.sh pics
